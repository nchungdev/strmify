<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strmify - Professional STRM Pipeline</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Strmify</h1>
        <p class="subtitle">Đẩy file .strm trực tiếp lên NAS/Local một cách chuyên nghiệp.</p>
      </div>
      <div class="header-right">
        <span id="nasStatus" style="font-size: 10px; font-weight: 900; color: #888;">OFFLINE</span>
        <span id="serverNameDisplay">Local</span>
        <button id="openSettingsBtn" class="icon-btn" title="Cài đặt">⚙️</button>
      </div>
    </header>

    <div id="status" class="status"></div>

    <!-- Top Configuration Area -->
    <section class="top-section">
      <div class="top-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 15px;">
        <div class="field">
          <label>TMDB URL / Search</label>
          <div style="display: flex; gap: 4px; position: relative;">
            <input id="tmdbUrl" type="text" placeholder="Dán link hoặc nhập tên để tìm..." spellcheck="false" autocomplete="off">
            <button id="fetchTmdbBtn" type="button" style="min-width: 80px;">Go</button>
            <div id="searchSuggestions" class="search-suggestions"></div>
          </div>
        </div>
        <div class="field">
          <label>Tên phim</label>
          <input id="seriesName" type="text" placeholder="Fetch từ TMDB..." readonly style="background: #f1f3f7; color: #555; cursor: not-allowed; border-style: dashed; font-weight: 700;">
        </div>
      </div>

      <!-- Tool Row 2 (Hidden by default) -->
      <div id="toolRow2" class="top-grid" style="display: none; grid-template-columns: 1fr auto; gap: 12px; align-items: end; border-top: 1px solid #eee; padding-top: 15px;">
        <div class="field">
          <label>Thư mục đích</label>
          <div style="display: flex; gap: 4px;">
            <input id="destPath" type="text" placeholder="/path/to/folder">
            <button id="browseBtn" type="button">Duyệt</button>
          </div>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button id="saveToNasBtn" class="success" style="height: 36px; min-width: 150px;">ĐẨY LÊN NAS</button>
        </div>
      </div>
    </section>

    <!-- Main Content Area: Side-by-Side (Hidden by default) -->
    <div id="mainWorkspace" class="main-grid" style="display: none;">
      <!-- Left: Editor -->
      <section style="margin-bottom: 0;">
        <div class="section-head">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h2>DANH SÁCH M3U8</h2>
            <span id="linkCount" style="font-size: 11px; background: #eef2f7; padding: 2px 8px; border-radius: 12px; font-weight: 800; color: var(--accent);">0 tập</span>
          </div>
          <button id="clearBtn" style="min-height: 28px; font-size: 11px; padding: 0 10px;">Clear</button>
        </div>
        <textarea id="bulkInput" placeholder="Tên tập|URL m3u8..."></textarea>
      </section>

      <!-- Right: Preview -->
      <section style="margin-bottom: 0;">
        <div class="section-head">
          <h2>XEM TRƯỚC CẤU TRÚC</h2>
        </div>
        <div class="stats">
          <div id="seasonStat" class="stat"><span>Số mùa</span><strong id="seasonCount">0</strong></div>
          <div class="stat"><span>Thành công / Tổng</span><strong id="successTotal">0 / 0</strong></div>
        </div>
        <div id="preview" class="preview-container">
          <div style="text-align: center; color: #999; padding-top: 100px; font-size: 13px;">Dán link để xem trước</div>
        </div>
      </section>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="margin:0; color: var(--ink); font-size: 18px;">Cài đặt hệ thống</h2>
        <button id="closeSettingsBtn" class="icon-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Chế độ lưu trữ</label>
          <select id="storageMode">
            <option value="remote">Remote NAS (SSH / Rsync)</option>
            <option value="local">Local Storage</option>
          </select>
        </div>
        <div id="remoteConfig">
          <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 12px; margin-bottom: 12px;">
            <div class="field" style="margin:0;"><label>Host IP</label><input id="sshHost" type="text" placeholder="192.168.1.x"></div>
            <div class="field" style="margin:0;"><label>Username</label><input id="sshUser" type="text" placeholder="admin"></div>
          </div>
          <div id="passwordFieldContainer" class="field">
            <label>Password SSH</label>
            <input id="sshPassword" type="password" placeholder="••••••••">
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <label style="font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--muted);">
              <input type="checkbox" id="rememberAuth" checked> <span>Ghi nhớ login</span>
            </label>
            <div>
              <button id="testNasBtn" type="button" style="min-height:32px; font-size:11px;">Kết nối thử</button>
              <button id="disconnectNasBtn" type="button" style="display:none; min-height:32px; font-size:11px; background:#fee;">Ngắt kết nối</button>
            </div>
          </div>
        </div>
        <div style="background: #f8f9fb; padding: 15px; border-radius: 12px; border: 1px solid var(--line);">
          <h3 style="margin: 0 0 10px 0; font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 900;">Gốc mặc định</h3>
          <div class="field">
            <label>Phim bộ (TV)</label>
            <div style="display: flex; gap: 5px;">
              <input id="tvRoot" type="text" placeholder="/path/to/tv">
              <button id="browseTvBtn" type="button" style="min-height:38px;">📂</button>
              <button id="testTvBtn" type="button">Check</button>
            </div>
          </div>
          <div class="field" style="margin:0;">
            <label>Phim lẻ (Movie)</label>
            <div style="display: flex; gap: 5px;">
              <input id="movieRoot" type="text" placeholder="/path/to/movie">
              <button id="browseMovieBtn" type="button" style="min-height:38px;">📂</button>
              <button id="testMovieBtn" type="button">Check</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveSettingsBtn" class="primary" style="width: 100%;">LƯU VÀ ĐÓNG</button>
      </div>
    </div>
  </div>

  <!-- Directory Browser Modal -->
  <div id="dirBrowser" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0; font-size: 15px; font-weight: 800;">DUYỆT THƯ MỤC</h3>
        <button id="closeBrowserBtn" class="icon-btn">&times;</button>
      </div>
      <div id="browserPath" style="padding: 10px 20px; background: #f8f9fa; font-size: 11px; font-family: monospace; border-bottom: 1px solid var(--line); color: var(--accent); white-space: nowrap; overflow-x: auto;"></div>
      <div id="browserList" class="browser-list"></div>
      <div class="modal-footer">
        <button id="selectDirBtn" class="primary" style="width: 100%;">CHỌN THƯ MỤC NÀY</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
